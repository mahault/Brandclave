# BrandClave source registry — LOAD-BEARING, read by ingestion/registry.py.
#
# Every data source the platform knows about, in one place. Adding a source is
# one entry here plus (for content) a small scraper class.
#
#   kind:     content -> produces RawContent rows | metric -> produces demand_metrics rows
#   status:   active  -> in the POMDP rotation and runnable now
#             planned -> catalogued for rollout, not yet implemented (class omitted)
#             blocked -> dead or ToS-blocked; kept for the record, never scheduled
#   priority: rollout order for planned sources / attention weight for active ones
#
# Catalogue and legal notes come from REVIVAL-AND-COMMERCIAL-PLAN.md §4.

sources:
  # ── Consumer voice ──────────────────────────────────────────────────────────
  bluesky:
    class: ingestion.social.bluesky_scraper.BlueskyScraper
    kind: content
    type: social
    status: active
    priority: high
    note: "AT Protocol search via an authenticated session (BLUESKY_HANDLE + BLUESKY_APP_PASSWORD); public AppViews 403 scripted clients since 2026-07/09"
    config:
      # Quoted phrases: bare "hotel stay" also matched every post containing "stay",
      # which filled Social Pulse with unrelated chatter (verified 2026-09-04).
      queries:
        - '"boutique hotel"'
        - '"hotel recommendation"'
        - '"hotel recommendations"'
        - '"where to stay" hotel'
        - '"wellness retreat"'
        - '"workcation"'
        - '"digital nomad" city'
        - '"airbnb vs hotel"'
        - '"best hotel" city'
        - '"checked into" hotel'
        - '"hotel bar"'
        - '"design hotel"'
      max_per_query: 50
      lang: "en"

  youtube:
    class: ingestion.social.youtube_scraper.YouTubeScraper
    kind: content
    type: social
    status: active
    priority: high
    note: "Data API v3; 100 search calls/day is the scarce budget; comments not stored beyond 30 days"

  quora:
    class: ingestion.social.quora_scraper.QuoraScraper
    kind: content
    type: social
    status: active
    priority: low
    note: "verify terms and yield; demote or block if it stops returning"

  mastodon:
    kind: content
    type: social
    status: planned
    priority: medium
    note: "300 req/5min per instance; budget per instance, start with mastodon.social + travel instances"

  travel_substacks:
    kind: content
    type: news
    status: planned
    priority: medium
    note: "long-form consumer voice via RSS; curate 10-20 travel/design newsletters"

  podcast_transcripts:
    kind: content
    type: social
    status: planned
    priority: low
    note: "travel & lifestyle podcasts; richer signal than headlines"

  reddit:
    class: ingestion.social.reddit_scraper.RedditScraper
    kind: content
    type: social
    status: blocked
    priority: high
    note: "public JSON 403 since 2026-03; official free tier is non-commercial by terms; commercial contract ≈ $0.24/1k on review"

  # ── Geo-resolvable demand (metric backbone) ────────────────────────────────
  wikimedia_pageviews:
    class: ingestion.metrics.wikimedia_pageviews.WikimediaPageviewsScraper
    kind: metric
    type: metric
    status: active
    priority: high
    note: "free, no key; daily destination interest back to 2015; requires descriptive User-Agent"
    config:
      days_back: 30
      metric: "wikipedia_pageviews"
      cities:
        - { city: "Lisbon",        country: "Portugal",       article: "Lisbon" }
        - { city: "Porto",         country: "Portugal",       article: "Porto" }
        - { city: "Barcelona",     country: "Spain",          article: "Barcelona" }
        - { city: "Tokyo",         country: "Japan",          article: "Tokyo" }
        - { city: "Kyoto",         country: "Japan",          article: "Kyoto" }
        - { city: "Bali",          country: "Indonesia",      article: "Bali" }
        - { city: "Paris",         country: "France",         article: "Paris" }
        - { city: "Dubai",         country: "UAE",            article: "Dubai" }
        - { city: "Bengaluru",     country: "India",          article: "Bengaluru" }
        - { city: "New York City", country: "USA",            article: "New_York_City" }
        - { city: "Miami",         country: "USA",            article: "Miami" }
        - { city: "Austin",        country: "USA",            article: "Austin,_Texas" }
        - { city: "Mexico City",   country: "Mexico",         article: "Mexico_City" }
        - { city: "Tulum",         country: "Mexico",         article: "Tulum" }
        - { city: "Medellín",      country: "Colombia",       article: "Medellín" }
        - { city: "Buenos Aires",  country: "Argentina",      article: "Buenos_Aires" }
        - { city: "London",        country: "UK",             article: "London" }
        - { city: "Rome",          country: "Italy",          article: "Rome" }
        - { city: "Athens",        country: "Greece",         article: "Athens" }
        - { city: "Istanbul",      country: "Turkey",         article: "Istanbul" }
        - { city: "Marrakesh",     country: "Morocco",        article: "Marrakesh" }
        - { city: "Cape Town",     country: "South Africa",   article: "Cape_Town" }
        - { city: "Reykjavik",     country: "Iceland",        article: "Reykjavík" }
        - { city: "Bangkok",       country: "Thailand",       article: "Bangkok" }
        - { city: "Seoul",         country: "South Korea",    article: "Seoul" }
        - { city: "Singapore",     country: "Singapore",      article: "Singapore" }
        - { city: "Tbilisi",       country: "Georgia",        article: "Tbilisi" }

  eurostat_tourism:
    kind: metric
    type: metric
    status: planned
    priority: high
    note: "tour_occ_* arrivals/occupancy by NUTS region incl. short-term rentals from 2018; free, no key"

  us_ntto_arrivals:
    kind: metric
    type: metric
    status: planned
    priority: medium
    note: "I-94/I-92 monthly international arrivals to the US, filterable by country"

  osm_overpass:
    kind: metric
    type: metric
    status: planned
    priority: medium
    note: "supply-side density (hotels/restaurants/attractions per area); ~10k req/day fair use"

  inside_airbnb:
    kind: metric
    type: metric
    status: planned
    priority: medium
    note: "quarterly listings + review velocity (occupancy proxy); check per-city licence before commercial use"

