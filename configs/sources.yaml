    kind: content
    type: review
    status: blocked
    note: "ToS; legacy Content API sunsets 2026-08-31, replaced by Terra (quote-only) — BD conversation, not scraping"
  booking:
    class: ingestion.reviews.booking_scraper.BookingScraper
    kind: content
    type: review
    status: blocked
    note: "ToS; use licensed aggregators if brand review data matters"

  gdelt:
    class: ingestion.news.gdelt.GDELTScraper
    kind: content
    type: news
    status: active
    priority: high
    note: "GDELT DOC 2.0 global news index; free; one request per 5 s; bodies fetched for the top articles"
    config:
      timespan: 3d
      max_records: 75
      fetch_bodies: 30

  sec_edgar:
    class: ingestion.news.sec_edgar.SECEdgarScraper
    kind: content
    type: news
    status: active
    priority: high
    note: "official 8-K filings from hotel operators, REITs and travel platforms via per-company Atom feeds (full-text search endpoint is WAF-gated); SEC asks for a 'Company email' UA and <=10 req/s"
    config:
      forms: [8-K]
      per_company: 3
