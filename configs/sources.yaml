# BrandClave source registry — LOAD-BEARING, read by ingestion/registry.py.
#
# Every data source the platform knows about, in one place. Adding a source is
# one entry here plus (for content) a small scraper class.
#
#   kind:     content -> produces RawContent rows | metric -> produces demand_metrics rows
#   status:   active  -> in the POMDP rotation and runnable now
#             planned -> catalogued for rollout, not yet implemented (class omitted)
#             blocked -> dead or ToS-blocked; kept for the record, never scheduled
#   priority: rollout order for planned sources / attention weight for active ones
#
# Catalogue and legal notes come from REVIVAL-AND-COMMERCIAL-PLAN.md §4.

sources:
  # ── Consumer voice ──────────────────────────────────────────────────────────
  bluesky:
    class: ingestion.social.bluesky_scraper.BlueskyScraper
    kind: content
    type: social
    status: active
    priority: high
    note: "AT Protocol search via an authenticated session (BLUESKY_HANDLE + BLUESKY_APP_PASSWORD); public AppViews 403 scripted clients since 2026-07/09"
    config:
      # Quoted phrases: bare "hotel stay" also matched every post containing "stay",
      # which filled Social Pulse with unrelated chatter (verified 2026-09-04).
      queries:
        - '"boutique hotel"'
        - '"hotel recommendation"'
        - '"hotel recommendations"'
        - '"where to stay" hotel'
        - '"wellness retreat"'
        - '"workcation"'
        - '"digital nomad" city'
        - '"airbnb vs hotel"'
        - '"best hotel" city'
        - '"checked into" hotel'
        - '"hotel bar"'
        - '"design hotel"'
      max_per_query: 50
      lang: "en"

  youtube:
    class: ingestion.social.youtube_scraper.YouTubeScraper
    kind: content
    type: social
    status: active
    priority: high
    note: "Data API v3; 100 search calls/day is the scarce budget; comments not stored beyond 30 days"

  quora:
    class: ingestion.social.quora_scraper.QuoraScraper
    kind: content
    type: social
    status: active
    priority: low
    note: "verify terms and yield; demote or block if it stops returning"

  mastodon:
    class: ingestion.social.mastodon_scraper.MastodonScraper
    kind: content
    type: social
    status: active
    priority: medium
    note: "public hashtag timelines, no token; 300 req/5min per instance, budget per instance"
    config:
      instances: [mastodon.social, mstdn.social, fosstodon.org]
      hashtags: [hotel, hotels, boutiquehotel, hospitality, digitalnomad, resort, hostel, airbnb, hoteldesign]
      limit_per_tag: 40
      langs: [en]

  travel_substacks:
    kind: content
    type: news
    status: planned
    priority: medium
    note: "long-form consumer voice via RSS; curate 10-20 travel/design newsletters"

  podcast_transcripts:
    kind: content
    type: social
    status: planned
    priority: low
    note: "travel & lifestyle podcasts; richer signal than headlines"

  reddit:
    class: ingestion.social.reddit_scraper.RedditScraper
    kind: content
    type: social
    status: blocked
    priority: high
    note: "public JSON 403 since 2026-03; official free tier is non-commercial by terms; commercial contract ≈ $0.24/1k on review"

  # ── Geo-resolvable demand (metric backbone) ────────────────────────────────
  wikimedia_pageviews:
    class: ingestion.metrics.wikimedia_pageviews.WikimediaPageviewsScraper
    kind: metric
    type: metric
    status: active
    priority: high
    note: "free, no key; daily destination interest back to 2015; requires descriptive User-Agent"
    config:
      days_back: 30
      metric: "wikipedia_pageviews"
      cities:
        - { city: "Lisbon",        country: "Portugal",       article: "Lisbon" }
        - { city: "Porto",         country: "Portugal",       article: "Porto" }
        - { city: "Barcelona",     country: "Spain",          article: "Barcelona" }
        - { city: "Tokyo",         country: "Japan",          article: "Tokyo" }
        - { city: "Kyoto",         country: "Japan",          article: "Kyoto" }
        - { city: "Bali",          country: "Indonesia",      article: "Bali" }
        - { city: "Paris",         country: "France",         article: "Paris" }
        - { city: "Dubai",         country: "UAE",            article: "Dubai" }
        - { city: "Bengaluru",     country: "India",          article: "Bengaluru" }
        - { city: "New York City", country: "USA",            article: "New_York_City" }
        - { city: "Miami",         country: "USA",            article: "Miami" }
        - { city: "Austin",        country: "USA",            article: "Austin,_Texas" }
        - { city: "Mexico City",   country: "Mexico",         article: "Mexico_City" }
        - { city: "Tulum",         country: "Mexico",         article: "Tulum" }
        - { city: "Medellín",      country: "Colombia",       article: "Medellín" }
        - { city: "Buenos Aires",  country: "Argentina",      article: "Buenos_Aires" }
        - { city: "London",        country: "UK",             article: "London" }
        - { city: "Rome",          country: "Italy",          article: "Rome" }
        - { city: "Athens",        country: "Greece",         article: "Athens" }
        - { city: "Istanbul",      country: "Turkey",         article: "Istanbul" }
        - { city: "Marrakesh",     country: "Morocco",        article: "Marrakesh" }
        - { city: "Cape Town",     country: "South Africa",   article: "Cape_Town" }
        - { city: "Reykjavik",     country: "Iceland",        article: "Reykjavík" }
        - { city: "Bangkok",       country: "Thailand",       article: "Bangkok" }
        - { city: "Seoul",         country: "South Korea",    article: "Seoul" }
        - { city: "Singapore",     country: "Singapore",      article: "Singapore" }
        - { city: "Tbilisi",       country: "Georgia",        article: "Tbilisi" }

  eurostat_tourism:
    class: ingestion.metrics.eurostat_tourism.EurostatTourismScraper
    kind: metric
    type: metric
    status: active
    priority: high
    note: "official monthly nights spent (tour_occ_nim) by country; free JSON-stat API, no key"
    config:
      metric: eurostat_nights_spent
      nace_r2: I551-I553
      since: "2023-01"
      geo: [ES, FR, IT, PT, EL, DE, NL, AT, HR, IS, IE, DK, SE, PL, CZ, HU, TR]

  us_ntto_arrivals:
    kind: metric
    type: metric
    status: planned
    priority: medium
    note: "I-94 monthly international arrivals; api.trade.gov certificate expired (verified 2026-09-04) and the xlsx download path changes each release — needs a scrape of the program page"

  osm_overpass:
    class: ingestion.metrics.osm_overpass.OSMOverpassScraper
    kind: metric
    type: metric
    status: active
    priority: medium
    note: "supply-side density (hotels/restaurants/nightlife/attractions) per city boundary; ~10k req/day fair use; one query per city with a pause"
    config:
      cities:
        - { city: "Lisbon", country: "Portugal", osm_admin_level: 7 }
        - { city: "Porto", country: "Portugal", osm_admin_level: 7 }
        - { city: "Barcelona", country: "Spain", osm_admin_level: 8 }
        - { city: "Paris", country: "France", osm_admin_level: 8 }
        - { city: "Rome", country: "Italy", osm_admin_level: 8 }
        - { city: "Athens", country: "Greece", osm_admin_level: 8 }
        - { city: "Miami", country: "USA", osm_admin_level: 8 }
        - { city: "Austin", country: "USA", osm_admin_level: 8 }
        - { city: "Mexico City", country: "Mexico", osm_admin_level: 4 }
        - { city: "Buenos Aires", country: "Argentina", osm_admin_level: 4 }
        - { city: "Istanbul", country: "Turkey", osm_admin_level: 4 }
        - { city: "Dubai", country: "UAE", osm_admin_level: 4 }
        - { city: "Reykjavik", country: "Iceland", osm_admin_level: 6 }
        - { city: "Bangkok", country: "Thailand", osm_admin_level: 4 }
        - { city: "Seoul", country: "South Korea", osm_admin_level: 4 }
        - { city: "Singapore", country: "Singapore", osm_admin_level: 2 }
        - { city: "Tokyo", country: "Japan", osm_admin_level: 4 }

  inside_airbnb:
    class: ingestion.metrics.inside_airbnb.InsideAirbnbScraper
    kind: metric
    type: metric
    status: active
    priority: medium
    note: "quarterly listings + review velocity (occupancy proxy) from the visualisations summary CSV; CC BY 4.0, attribute Inside Airbnb; check per-city licence before commercial use"
    config:
      cities:
        - { city: "Lisbon", country: "Portugal", slug: lisbon }
        - { city: "Porto", country: "Portugal", slug: porto }
        - { city: "Barcelona", country: "Spain", slug: barcelona }
        - { city: "Paris", country: "France", slug: paris }
        - { city: "Rome", country: "Italy", slug: rome }
        - { city: "Athens", country: "Greece", slug: athens }
        - { city: "London", country: "UK", slug: london }
        - { city: "New York City", country: "USA", slug: new-york-city }
        - { city: "Austin", country: "USA", slug: austin }
        - { city: "Mexico City", country: "Mexico", slug: mexico-city }
        - { city: "Buenos Aires", country: "Argentina", slug: buenos-aires }
        - { city: "Istanbul", country: "Turkey", slug: istanbul }
        - { city: "Cape Town", country: "South Africa", slug: cape-town }
        - { city: "Bangkok", country: "Thailand", slug: bangkok }
        - { city: "Singapore", country: "Singapore", slug: singapore }
        - { city: "Tokyo", country: "Japan", slug: tokyo }

  # ── Societal-shift signal (the actual thesis) ───────────────────────────────
  pew_research:
    class: ingestion.news.culture_feeds.PewResearchScraper
    kind: content
    type: news
    status: active
    priority: low
    note: "consumer and social attitude research; free RSS; keyword-filtered to travel/leisure"
    config:
      filter_keywords: true

  wef_reports:
    kind: content
    type: news
    status: planned
    priority: medium
    note: "future-of-travel / future-of-work themes"

  edelman_trust:
    kind: content
    type: news
    status: planned
    priority: low
    note: "annual trust barometer"

  consulting_outlooks:
    kind: content
    type: news
    status: planned
    priority: medium
    note: "McKinsey travel RSS 404 (2026-09-04); curate per-firm report pages"

