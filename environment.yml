name: brandclave
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # Core
    - pydantic>=2.0
    - pydantic-settings>=2.0
    - python-dotenv>=1.0.0
    # Database
    - sqlalchemy>=2.0
    - alembic>=1.13
    - psycopg[binary]>=3.1
    - chromadb>=0.4.0
    # Scraping
    - httpx>=0.25.0
    - beautifulsoup4>=4.12.0
    - feedparser>=6.0.0
    - lxml>=4.9.0
    # NLP
    - mistralai>=1.0.0
    - langdetect>=1.0.9
    - textblob>=0.17.0
    - sentence-transformers>=2.2.0
    - hdbscan>=0.8.33
    # API
    - fastapi>=0.109.0
    - uvicorn>=0.27.0
    # Auth
    - pyjwt>=2.8
    # Utilities
    - pyyaml>=6.0
    # Caching & Scheduling
    - redis>=4.0.0
    - APScheduler>=3.10.0
    # Active Inference
    # Must match requirements.txt: the POMDP code uses the JAX API
    # (infer_policies(qs), sample_action(..., rng_key=...)), which is the 1.x line
    - inferactively-pymdp>=1.0.0,<2.0
    - jax>=0.4.0
    - jaxlib>=0.4.0

