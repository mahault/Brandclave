name: CI

on:
  push:
    branches: [main, genius-brandclave]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (errors and undefined names only)
        # Legacy code predates a style config; gate on real defects,
        # not formatting. Tighten selection as the codebase is cleaned up.
        run: ruff check . --select E9,F63,F7,F82

      - name: Fast tests (no external services)
        env:
          SCHEDULER_ENABLED: "false"
          LOG_FORMAT: text
        run: pytest tests/ingestion -q

      - name: Boot check
        env:
          SCHEDULER_ENABLED: "false"
        run: python -c "from api.main import app; print('boot ok')"
